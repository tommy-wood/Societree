name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm run build:web
        env:
          # Placeholders: the build doesn't talk to Supabase. Real values are set
          # in the hosting provider (Cloudflare Pages / Vercel) at deploy time.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 7

  database:
    name: Migrations, seed and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies migrations)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - name: Seed and test
        run: |
          eval "$(npx supabase status -o env)"
          export EXPO_PUBLIC_SUPABASE_URL="$API_URL"
          export EXPO_PUBLIC_SUPABASE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SECRET_KEY"
          node scripts/seed.mjs
          node scripts/test-rls.mjs
      - name: Generated types are up to date
        run: |
          npx supabase gen types typescript --local > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts
